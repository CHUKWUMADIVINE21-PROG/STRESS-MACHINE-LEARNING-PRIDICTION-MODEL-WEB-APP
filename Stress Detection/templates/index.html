<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stress Detection</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(24px, 5vw, 44px);
      border: 1px solid #e1e7f0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(34, 52, 84, 0.1);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 5vw, 2.2rem);
    }

    p {
      color: #596579;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 24px 0 8px;
      font-weight: 650;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #cbd4e1;
      border-radius: 12px;
      font: inherit;
      line-height: 1.5;
    }

    textarea:focus-visible,
    button:focus-visible {
      outline: 3px solid #9db8ff;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 13px 18px;
      border: 0;
      border-radius: 12px;
      background: #315ed4;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #244cb8;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #edf4ff;
      color: #173a82;
    }

    #result.error {
      background: #fff0ef;
      color: #9c2921;
    }

    .note {
      margin-bottom: 0;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Stress Detection</h1>
    <p>Enter a passage of text to get a prediction from the model.</p>

    <form id="prediction-form">
      <label for="text">Your text</label>
      <textarea id="text" name="text" required placeholder="Type or paste text here..."></textarea>
      <button id="submit-button" type="submit">Check text</button>
    </form>

    <div id="result" role="status" aria-live="polite" hidden></div>
    <p class="note">This model provides an estimate and is not a clinical assessment.</p>
  </main>

  <script>
    const form = document.getElementById("prediction-form");
    const input = document.getElementById("text");
    const button = document.getElementById("submit-button");
    const result = document.getElementById("result");
    const labels = {
      0: "No stress detected",
      1: "Stress detected",
      not_stressed: "No stress detected",
      stressed: "Stress detected"
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.hidden = false;
      result.classList.remove("error");
      result.textContent = "Checking...";
      button.disabled = true;

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
          body: new URLSearchParams({ text: input.value.trim() })
        });

        if (!response.ok) {
          throw new Error(`Request failed (${response.status}).`);
        }

        const data = await response.json();
        if (!Object.prototype.hasOwnProperty.call(data, "prediction")) {
          throw new Error("The server response did not include a prediction.");
        }

        const prediction = data.prediction;
        result.textContent = Object.prototype.hasOwnProperty.call(labels, prediction)
          ? labels[prediction]
          : `Model prediction: ${String(prediction)}`;
      } catch (error) {
        result.classList.add("error");
        result.textContent = error instanceof Error
          ? `Could not get a prediction: ${error.message}`
          : "Could not get a prediction. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
