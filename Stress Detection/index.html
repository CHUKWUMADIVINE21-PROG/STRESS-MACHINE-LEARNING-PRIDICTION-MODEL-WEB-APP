<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stress Detection</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f3f6fb;
      color: #172033;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 600px);
      padding: 32px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 12px 40px #2234541a;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 160px;
      padding: 12px;
      border: 1px solid #cbd4e1;
      border-radius: 8px;
      font: inherit;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #315ed4;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Stress Detection</h1>
    <p>Enter some text to get a prediction from the model.</p>

    <form id="prediction-form">
      <label for="text">Your text</label>
      <textarea id="text" name="text" required></textarea>
      <button id="submit-button" type="submit">Check text</button>
    </form>

    <p id="result" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("prediction-form");
    const input = document.getElementById("text");
    const button = document.getElementById("submit-button");
    const result = document.getElementById("result");

    const labels = {
      not_stressed: "No stress detected",
      stressed: "Stress detected",
      0: "No stress detected",
      1: "Stress detected"
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.textContent = "Checking...";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: new URLSearchParams({ text: input.value.trim() })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `Request failed (${response.status}).`);
        }

        result.textContent = Object.prototype.hasOwnProperty.call(
          labels,
          data.prediction
        )
          ? labels[data.prediction]
          : `Model prediction: ${String(data.prediction)}`;
      } catch (error) {
        result.textContent = `Could not get a prediction: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
